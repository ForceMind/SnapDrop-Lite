# Never log query strings, fragments, SDP or invitation tokens.
log_format zeydrop '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=zeydrop_ws:1m rate=10r/m;
server {
    listen 80;
    access_log /var/log/nginx/zeydrop.access.log zeydrop;
    error_log /var/log/nginx/zeydrop.error.log warn;
    server_name @DOMAIN@;
    return 308 https://@DOMAIN@$request_uri;
}
server {
    listen 443 ssl;
    server_name @DOMAIN@;
    ssl_certificate @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/zeydrop/current/dist;
    access_log /var/log/nginx/zeydrop.access.log zeydrop;
    error_log /var/log/nginx/zeydrop.error.log warn;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://@DOMAIN@; img-src 'self' blob:; media-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location = /server/webrtc {
        limit_req zone=zeydrop_ws burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location /server { return 404; }
    location = /health { access_log off; return 200 'Zeydrop static OK\n'; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
