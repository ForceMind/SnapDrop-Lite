name: Zeydrop verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zeydrop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts && npm --prefix server ci --ignore-scripts
      - run: npm audit --omit=dev && npm --prefix server audit --omit=dev
      - run: npm test
      - run: bash -n build.sh deploy.sh scripts/rollback.sh
      - run: npm run build && node scripts/check-build.mjs
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: bash scripts/check-nginx.sh
      - id: browsers
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium firefox webkit
      - run: LARGE_FILE_TEST=1 npm run test:browser
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: BROWSER_TYPE=firefox npm run test:browser
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: BROWSER_TYPE=webkit npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeydrop-test-evidence
          path: test-results/
          retention-days: 7
